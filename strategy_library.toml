# --- Allocation ----------------------------------------------------------
# These split capital across the universe, so they get a mixed one.

[[portfolio]]
Name = "Alloc: 60/40 rebalanced"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/rebalance.lua"
[portfolio.Params]
rebalance_days = 63
weights = { "$SP500" = 60, "$CASH" = 40 }

[[portfolio]]
Name = "Alloc: 60/40 buy & hold (no rebalance)"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/buy_and_hold_weighted.lua"
[portfolio.Params]
weights = { "$SP500" = 60, "$CASH" = 40 }

# Expect a near-flat curve here: inverse-volatility weighting is uncapped,
# so pairing an index with $CASH parks almost everything in cash. Swap
# $CASH for a bond fund (or another equity index) to see it allocate.
[[portfolio]]
Name = "Alloc: risk parity"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/risk_parity.lua"
[portfolio.Params]
lookback = 60
rebalance_days = 21

[[portfolio]]
Name = "Alloc: momentum rotation"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["AAPL", "MSFT", "GOOGL", "$CASH"]
Strategy = "lua:strategies/momentum_rotation.lua"
[portfolio.Params]
lookback = 126
top_n = 2
rebalance_days = 21
