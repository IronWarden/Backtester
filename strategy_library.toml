# --- Allocation ----------------------------------------------------------
# These split capital across the universe, so they get a mixed one.

[[portfolio]]
Name = "Alloc: 60/40 rebalanced"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/rebalance.lua"
[portfolio.Params]
rebalance_days = 63
weights = { "$SP500" = 60, "$CASH" = 40 }

[[portfolio]]
Name = "Alloc: 60/40 buy & hold (no rebalance)"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/buy_and_hold.lua"
[portfolio.Params]
weights = { "$SP500" = 60, "$CASH" = 40 }

# Expect a near-flat curve here: inverse-volatility weighting is uncapped,
# so pairing an index with $CASH parks almost everything in cash. Swap
# $CASH for a bond fund (or another equity index) to see it allocate.
[[portfolio]]
Name = "Alloc: risk parity"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/risk_parity.lua"
[portfolio.Params]
lookback = 60
rebalance_days = 21

[[portfolio]]
Name = "Alloc: momentum rotation"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["AAPL", "MSFT", "GOOGL", "$CASH"]
Strategy = "lua:strategies/momentum_rotation.lua"
[portfolio.Params]
lookback = 126
top_n = 2
rebalance_days = 21


# --- Fundamentals (SEC filings) ------------------------------------------
#
# Ranked screens on reported figures, read from sec_financials — run
# `python3 add_sec_financials.py` first, or they hold nothing (Fund Cov %
# says so). Each script's fundamentals = { ... } table says which figures it
# reads, and the engine loads them when the block declares none of its own,
# so naming the Strategy is enough. Each figure is the one first filed, usable from the day after the
# filing. The list below is 41 large non-financial companies; every one is
# alive today, which flatters any long-only screen — compare against the
# equal-weight baseline, not against zero. GOOGL, DIS, MDT and XOM are left
# out: their SEC history before 2015 sits under a previous filer.

