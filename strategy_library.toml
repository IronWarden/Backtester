# Strategy library — every shipped strategy over the same tickers and
# window, so the results table compares them directly. Open this in
# Advanced mode and hit "Run backtest".
#
# To adapt: change Tickers / dates once per block, or delete the blocks you
# don't care about. Each Strategy points at a file in strategies/ that you
# can copy and edit — see strategies/README.md for the Lua API.
#
# Note the two families need different universes:
#   - Per-ticker signal strategies (trend, breakout, RSI, Bollinger) decide
#     each ticker independently, so a basket of individual stocks is right.
#   - Allocation strategies (rotation, risk parity, rebalance) split capital
#     across the universe, so mixing asset classes ($SP500 with $CASH) is
#     where they earn their keep.

# --- Baselines -----------------------------------------------------------

[[portfolio]]
Name = "Baseline: buy & hold"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["AAPL", "MSFT", "GOOGL"]
Strategy = "buyAndHold:equalWeights"

[[portfolio]]
Name = "Baseline: dollar-cost averaging"
BuyingPower = 100000.0
StartDate = "2015-06-01"
EndDate = "2025-01-01"
Tickers = ["AAPL", "MSFT", "GOOGL"]
Strategy = "lua:strategies/dca.lua"
# ~115 monthly buys over the window; 870/buy fully invests the balance.
[portfolio.Params]
amount = 870.0
every_days = 21

