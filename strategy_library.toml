# --- Famous investors ----------------------------------------------------
#
# The same portfolios the Backtest tab offers under "Or copy a famous
# investor". Each is something you could have bought on its first day: a
# published recipe, or a 13F bought the day after it was filed -- never
# today's holdings run backwards, which only lists what worked.

# Buffett's 2013-letter instructions for his estate: 90% S&P 500 index fund,
# 10% short-term government bonds ($CASH is the T-bill series).
[[portfolio]]
Name = "Investor: Buffett 90/10"
BuyingPower = 100000.0
StartDate = "1996-09-23"
EndDate = "2026-09-23"
Tickers = ["$SP500", "$CASH"]
Strategy = "lua:strategies/rebalance.lua"
Benchmark = "$SP500"
[portfolio.Params]
weights = { "$SP500" = 90.0, "$CASH" = 10.0 }

